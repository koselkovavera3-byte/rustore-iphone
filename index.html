<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="RuStore"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    href="./icon.svg"
    type="image/svg+xml"
  >

  <title>RuStore</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f7;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #e5e5e7;
      padding:
        env(safe-area-inset-top)
        16px
        12px
        16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 22px;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 9px;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 16px 110px;
    }

    h1 {
      font-size: 30px;
      margin: 18px 0;
    }

    h2 {
      font-size: 22px;
      margin: 24px 0 12px;
    }

    h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .search {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 14px;
      background: #e9e9ee;
      padding: 0 16px;
      outline: none;
      margin-bottom: 8px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow:
        0 1px 3px rgba(0,0,0,.05);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .name {
      font-weight: 700;
      font-size: 17px;
    }

    .muted {
      color: #777;
      font-size: 14px;
    }

    .rating {
      margin-top: 5px;
      font-size: 14px;
    }

    .desc {
      margin-top: 12px;
      line-height: 1.45;
    }

    .heart {
      border: 0;
      background: transparent;
      font-size: 27px;
      padding: 4px 6px;
    }

    button.primary,
    button.secondary {
      border: 0;
      border-radius: 13px;
      min-height: 46px;
      padding: 0 16px;
    }

    .primary {
      background: #111;
      color: #fff;
    }

    .secondary {
      background: #ededf2;
      color: #111;
    }

    .back {
      border: 0;
      background: transparent;
      padding: 4px 0 16px;
      font-size: 17px;
    }

    .empty {
      text-align: center;
      color: #777;
      background: #fff;
      border-radius: 18px;
      padding: 35px 20px;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid #ddd;
    }

    .tab {
      border: 0;
      background: transparent;
      color: #777;
      padding: 7px 18px;
      border-radius: 12px;
      font-size: 13px;
    }

    .tab.active {
      color: #111;
      font-weight: 700;
      background: #eeeef2;
    }

    .install-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #f0f0f5;
    }

  </style>
</head>

<body>

  <header>

    <div class="brand">
      <img
        src="./icon.svg"
        alt="RuStore"
      >

      <span>RuStore</span>
    </div>

  </header>

  <main id="app"></main>

  <nav class="bottom">

    <button
      class="tab active"
      data-tab="home"
    >
      ⌂
      <br>
      Главная
    </button>

    <button
      class="tab"
      data-tab="favorites"
    >
      ♡
      <br>
      Избранное
    </button>

    <button
      class="tab"
      data-tab="profile"
    >
      ◯
      <br>
      Профиль
    </button>

  </nav>

  <script src="./app.js?v=16"></script>

</body>
</html>
