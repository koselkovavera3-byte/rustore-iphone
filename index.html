<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="iOS App Hub"
  >

  <title>iOS App Hub</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest?v=20260916-5"
  >

  <link
    rel="icon"
    href="./icon.svg?v=20260916-4"
    type="image/svg+xml"
  >

  <link
    rel="apple-touch-icon"
    href="./icon.svg?v=20260916-4"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #f5f5f7;
    }

    body {
      margin: 0;
      background: #f5f5f7;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        16px
        calc(90px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 18px 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.8px;
    }

    h2 {
      margin: 24px 0 12px;
      font-size: 22px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .search {
      width: 100%;
      height: 48px;
      border: 1px solid #d2d2d7;
      border-radius: 14px;
      padding: 0 16px;
      background: #fff;
      outline: none;
      font-size: 17px;
    }

    .search:focus {
      border-color: #888;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 18px;
      box-shadow:
        0 2px 8px rgba(0,0,0,.04);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 15px;
      object-fit: cover;
    }

    .name {
      font-size: 18px;
      font-weight: 700;
    }

    .muted {
      color: #777;
      font-size: 14px;
    }

    .rating {
      margin-top: 4px;
      font-size: 14px;
    }

    .desc {
      margin-top: 10px;
      line-height: 1.45;
      color: #333;
    }

    .heart {
      border: 0;
      background: transparent;
      color: #111;
      font-size: 28px;
      line-height: 1;
      padding: 4px;
    }

    .primary,
    .secondary {
      border-radius: 13px;
      padding: 0 16px;
      min-height: 44px;
    }

    .primary {
      border: 0;
      background: #111;
      color: #fff;
    }

    .secondary {
      border: 1px solid #d2d2d7;
      background: #fff;
      color: #111;
    }

    .back {
      border: 0;
      background: transparent;
      padding: 4px 0;
      margin-bottom: 12px;
      color: #111;
      font-size: 17px;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #777;
    }

    .install-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #f5f5f7;
    }

    .install-step {
      margin: 12px 0;
      padding: 18px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e5e5e7;
    }

    .big-icon {
      padding: 12px 0;
      font-size: 42px;
      text-align: center;
    }

    .status {
      display: inline-block;
    }

    .status-available {
      color: #16803c;
    }

    .status-recovery {
      color: #8a5a00;
    }

    .status-web {
      color: #666;
    }

    .bottom-nav {
      position: fixed;
      z-index: 100;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      padding:
        8px
        12px
        calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.94);
      border-top: 1px solid #ddd;
      backdrop-filter: blur(16px);
    }

    .bottom-nav-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      gap: 8px;
    }

    .tab {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #777;
      font-weight: 600;
    }

    .tab.active {
      background: #111;
      color: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      font-size: 18px;
      font-weight: 800;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 9px;
    }
  </style>
</head>

<body>

  <main id="app">
    <div class="card">
      Загрузка iOS App Hub…
    </div>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">

      <button
        class="tab active"
        type="button"
        data-tab="home"
      >
        Главная
      </button>

      <button
        class="tab"
        type="button"
        data-tab="favorites"
      >
        Избранное
      </button>

      <button
        class="tab"
        type="button"
        data-tab="profile"
      >
        Профиль
      </button>

    </div>
  </nav>

  <script
    src="./app.js?v=20260916-4"
    defer
  ></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register(
          "./sW.js?v=20260916-4",
          {
            updateViaCache: "none"
          }
        ).catch(error => {
          console.error(
            "Service Worker:",
            error
          );
        });
      });
    }
  </script>

</body>
</html>
