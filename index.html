<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="RuStore"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest?v=20260916-4"
  >

  <link
    rel="icon"
    href="./icon.svg?v=20260916-4"
    type="image/svg+xml"
  >

  <link
    rel="apple-touch-icon"
    href="./icon.svg?v=20260916-4"
  >

  <title>RuStore</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      background: #f5f5f7;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #ffffff 0,
          #f5f5f7 280px
        );

      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.98);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,.90);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      border-bottom: 1px solid rgba(0,0,0,.08);

      padding:
        env(safe-area-inset-top)
        16px
        12px
        16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-height: 36px;

      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .brand img {
      width: 34px;
      height: 34px;

      border-radius: 9px;

      object-fit: cover;
    }

    main {
      width: 100%;
      max-width: 720px;

      margin: 0 auto;

      padding:
        18px
        16px
        120px;
    }

    h1 {
      margin: 18px 0;

      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -.7px;
    }

    h2 {
      margin: 25px 0 12px;

      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -.3px;
    }

    h3 {
      margin: 0 0 8px;

      font-size: 18px;
      line-height: 1.25;
    }

    p {
      margin: 0;
    }

    .search {
      width: 100%;
      height: 48px;

      border: 0;
      border-radius: 15px;

      background: #e9e9ee;

      padding: 0 16px;

      outline: none;

      color: #111;

      font-size: 16px;

      margin-bottom: 6px;

      -webkit-appearance: none;
    }

    .search:focus {
      background: #e2e2e8;
    }

    .search::placeholder {
      color: #8a8a91;
    }

    .card {
      background: #fff;

      border-radius: 19px;

      padding: 16px;

      margin-bottom: 12px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.04),
        0 5px 18px rgba(0,0,0,.025);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 58px;
      height: 58px;

      border-radius: 15px;

      object-fit: cover;

      flex-shrink: 0;

      background: #eee;
    }

    .name {
      font-weight: 750;
      font-size: 17px;

      line-height: 1.2;
    }

    .muted {
      color: #777;
      font-size: 14px;
      line-height: 1.4;
    }

    .rating {
      margin-top: 5px;

      font-size: 14px;
      font-weight: 600;
    }

    .desc {
      margin-top: 12px;

      line-height: 1.45;

      font-size: 15px;
    }

    .heart {
      border: 0;

      background: transparent;

      color: #111;

      font-size: 28px;

      line-height: 1;

      padding: 5px 6px;

      flex-shrink: 0;
    }

    button.primary,
    button.secondary {
      border: 0;

      border-radius: 14px;

      min-height: 46px;

      padding: 0 16px;

      font-weight: 650;

      transition:
        transform .12s ease,
        opacity .12s ease;
    }

    .primary {
      background: #111;
      color: #fff;
    }

    .secondary {
      background: #ededf2;
      color: #111;
    }

    .primary:hover,
    .secondary:hover {
      opacity: .9;
    }

    .back {
      border: 0;

      background: transparent;

      padding: 4px 0 16px;

      color: #111;

      font-size: 17px;

      font-weight: 500;
    }

    .empty {
      text-align: center;

      color: #777;

      background: #fff;

      border-radius: 19px;

      padding: 40px 20px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.04);
    }

    .bottom {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 200;

      display: flex;
      justify-content: space-around;
      align-items: center;

      padding:
        7px
        8px
        calc(
          7px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(255,255,255,.94);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      border-top:
        1px solid rgba(0,0,0,.10);
    }

    .tab {
      min-width: 90px;

      border: 0;

      background: transparent;

      color: #777;

      padding: 7px 14px;

      border-radius: 13px;

      font-size: 12px;

      line-height: 1.35;
    }

    .tab:first-line {
      font-size: 19px;
    }

    .tab.active {
      color: #111;

      font-weight: 700;

      background: #eeeef2;
    }

    .install-box {
      margin-top: 20px;

      padding: 18px;

      border-radius: 19px;

      background:
        linear-gradient(
          180deg,
          #f0f0f5,
          #e9e9ee
        );

      border: 1px solid rgba(0,0,0,.04);
    }

    .install-step {
      background: #fff;

      border-radius: 17px;

      padding: 17px;

      margin-top: 12px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.04);
    }

    .big-icon {
      font-size: 50px;

      text-align: center;

      margin: 10px 0 20px;
    }

    @media (min-width: 700px) {

      main {
        padding-left: 24px;
        padding-right: 24px;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="brand">

      <img
        src="./icon.svg?v=20260916-4"
        alt="RuStore"
      >

      <span>
        RuStore
      </span>

    </div>

  </header>

  <main id="app"></main>

  <nav
    class="bottom"
    aria-label="Основная навигация"
  >

    <button
      class="tab active"
      data-tab="home"
      type="button"
      aria-label="Главная"
    >
      ⌂
      <br>
      Главная
    </button>

    <button
      class="tab"
      data-tab="favorites"
      type="button"
      aria-label="Избранное"
    >
      ♡
      <br>
      Избранное
    </button>

    <button
      class="tab"
      data-tab="profile"
      type="button"
      aria-label="Профиль"
    >
      ◯
      <br>
      Профиль
    </button>

  </nav>

  <script
    src="./app.js?v=20260916-4"
    defer
  ></script>

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        async () => {

          try {

            const registrations =
              await navigator.serviceWorker
                .getRegistrations();

            for (
              const registration
              of registrations
            ) {

              await registration.update();

            }

            const registration =
              await navigator.serviceWorker.register(
                "./sW.js?v=20260916-4",
                {
                  updateViaCache: "none"
                }
              );

            await registration.update();

          } catch (error) {

            console.error(
              "Service Worker:",
              error
            );

          }

        }
      );

    }

  </script>

</body>

</html>
