<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0a0e1a"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="RuStore"
  >

  <title>RuStore</title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="icon.svg"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0a0e1a;
      color: #f4f4f4;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 110px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 22px;
      margin: 20px 0 14px;
    }

    .muted {
      color: #8b8f99;
      font-size: 13px;
    }

    .search {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.06);
      color: white;
      border-radius: 14px;
      padding: 0 16px;
      outline: none;
      margin-bottom: 14px;
    }

    .search:focus {
      border-color: #d4af37;
    }

    .card {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      background: #111;
      flex-shrink: 0;
    }

    .name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .rating {
      color: #d4af37;
      margin-top: 5px;
      font-size: 13px;
    }

    .desc {
      color: #b4b7c0;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .heart {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      color: #d4af37;
      font-size: 21px;
    }

    .secondary,
    .primary {
      border: 0;
      border-radius: 13px;
      min-height: 46px;
      padding: 0 18px;
      font-weight: 700;
    }

    .primary {
      background: #d4af37;
      color: #0a0e1a;
    }

    .secondary {
      background: rgba(255,255,255,.08);
      color: white;
    }

    .back {
      border: 0;
      background: transparent;
      color: #d4af37;
      padding: 8px 0 18px;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .progress {
      width: 100%;
      height: 9px;
      background: rgba(255,255,255,.08);
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #d4af37;
      transition: width .2s ease;
    }

    .success {
      color: #32cd32;
      font-weight: 700;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background: rgba(10,14,26,.96);
      border-top: 1px solid rgba(255,255,255,.08);
      display: flex;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    .nav-inner {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
    }

    .tab {
      border: 0;
      background: transparent;
      color: #777;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab span:first-child {
      font-size: 22px;
    }

    .tab.active {
      color: #d4af37;
    }

    .hidden {
      display: none !important;
    }

    .install-card {
      text-align: center;
      padding: 30px 20px;
    }

    .large-icon {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

  <main id="app"></main>

  <nav class="bottom-nav">

    <div class="nav-inner">

      <button
        class="tab active"
        data-tab="home"
      >
        <span>⌂</span>
        <span>Приложения</span>
      </button>

      <button
        class="tab"
        data-tab="favorites"
      >
        <span>♡</span>
        <span>Избранное</span>
      </button>

      <button
        class="tab"
        data-tab="profile"
      >
        <span>◯</span>
        <span>Профиль</span>
      </button>

    </div>

  </nav>

  <script src="app.js"></script>

</body>
</html>
