<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="RuStore"
  >

  <title>RuStore</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        system-ui,
        sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    body {
      padding-bottom: calc(82px + env(safe-area-inset-bottom));
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      padding:
        calc(14px + env(safe-area-inset-top))
        16px
        12px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      height: 46px;
      border: 0;
      outline: none;
      border-radius: 14px;
      padding: 0 16px;
      background: #eef0f3;
      color: #111;
      font-size: 16px;
    }

    .search::placeholder {
      color: #777;
    }

    .hidden {
      display: none !important;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 30px;
    }

    h2 {
      margin: 22px 4px 10px;
      font-size: 21px;
      letter-spacing: -.3px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 5px 18px rgba(0,0,0,.035);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      width: 62px;
      height: 62px;
      border-radius: 15px;
      object-fit: cover;
      flex: 0 0 62px;
      background: #eee;
    }

    .name {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.2px;
    }

    .muted {
      color: #777;
      font-size: 14px;
      margin-top: 3px;
    }

    .rating {
      margin-top: 5px;
      font-size: 14px;
      font-weight: 650;
    }

    .desc {
      color: #555;
      line-height: 1.4;
      font-size: 15px;
      margin-top: 13px;
    }

    .heart {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f1f1f3;
      font-size: 23px;
      flex: 0 0 42px;
    }

    .secondary,
    .card button:not(.heart) {
      min-height: 44px;
      border-radius: 13px;
      padding: 0 17px;
      background: #111;
      color: white;
      font-weight: 650;
    }

    .secondary {
      background: #ededf0 !important;
      color: #111 !important;
    }

    .back {
      background: transparent;
      padding: 4px 0 15px;
      color: #111;
      font-size: 16px;
      font-weight: 650;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 60px 20px;
      line-height: 1.5;
    }

    .tabs {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid rgba(0,0,0,.07);
    }

    .tab {
      flex: 1;
      max-width: 150px;
      min-height: 58px;
      background: transparent;
      color: #777;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
    }

    .tab-icon {
      font-size: 23px;
      line-height: 1;
    }

    .tab.active {
      color: #111;
      background: #f0f0f2;
    }

    @media (min-width: 700px) {
      .tabs {
        left: 50%;
        right: auto;
        width: 520px;
        transform: translateX(-50%);
        border-radius: 22px 22px 0 0;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="brand">RuStore</div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Поиск приложений"
      autocomplete="off"
      enterkeyhint="search"
    >
  </header>

  <main id="app"></main>

  <nav class="tabs" aria-label="Основная навигация">

    <button class="tab active" data-tab="home">
      <span class="tab-icon">⌂</span>
      <span>Главная</span>
    </button>

    <button class="tab" data-tab="favorites">
      <span class="tab-icon">♡</span>
      <span>Избранное</span>
    </button>

    <button class="tab" data-tab="profile">
      <span class="tab-icon">◯</span>
      <span>Профиль</span>
    </button>

  </nav>

  <script src="app.js"></script>

</body>
</html>
